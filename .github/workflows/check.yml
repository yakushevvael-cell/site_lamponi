# Проверка кода до выката.
#
# Раньше единственной проверкой была сборка на сервере: неудача означала
# остановку синхронизации, копию базы и откат — и всё это на работающем
# складе. Здесь то же самое происходит заранее и никому не мешает.
name: Проверка

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Зависимости
        run: npm install --no-audit --no-fund

      # Ошибки складываются в сводку прогона: она видна на странице Actions
      # без прав на скачивание логов.
      - name: Типы
        run: |
          npx tsc --noEmit 2>&1 | tee tsc.log || true
          if [ -s tsc.log ]; then
            {
              echo '### Ошибки типов'
              echo '```'
              cat tsc.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do echo "::error::$line"; done < tsc.log
            exit 1
          fi

      - name: Тесты
        run: |
          npm test 2>&1 | tee tests.log || {
            {
              echo '### Упавшие тесты'
              echo '```'
              tail -n 120 tests.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Сборка
        run: npm run build
        env:
          NODE_ENV: production
