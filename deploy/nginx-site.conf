# Сайт Lamponi FBS Hub. Домен и порт подставляет install.sh.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Файл ОСВ весит до 12 МБ — запас на служебные поля формы.
    client_max_body_size 20m;

    # Полная синхронизация остатков идёт шагами по несколько десятков секунд:
    # обрывать такой запрос по умолчанию нельзя, иначе часть складов останется
    # со старыми остатками.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Состояние последнего выката — чтобы проверять его снаружи, не заходя на
    # сервер. Внутри только ветка, короткий хеш коммита и результат сборки.
    location = /deploy-status.json {
        alias /var/www/lamponi/status.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
